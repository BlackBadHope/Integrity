name: Cross-machine SSH

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  two-machines:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenSSH client and server binaries
        # Only the binaries are used: the test starts its own non-root sshd on
        # loopback with a throwaway host key; the system service is not used.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openssh-client openssh-server bubblewrap
      - name: Build and install all public distributions
        run: |
          python -m pip install "build>=1.2,<2" "packaging>=24,<27" "pytest>=8.2,<10"
          python .github/scripts/build_components.py --root . --output "$RUNNER_TEMP/integrity-dist"
          python .github/scripts/install_components.py --wheels "$RUNNER_TEMP/integrity-dist" --venv "$RUNNER_TEMP/integrity-check" --github-path "$GITHUB_PATH"
      - name: Two-machine forced-command test (required, never skipped)
        env:
          INTEGRITY_REMOTE_E2E_REQUIRED: "1"
          INTEGRITY_CORE_INSTANCE_REQUIRED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -q -p no:cacheprovider -rs tests/test_two_machine_ssh.py tests/test_core_instance.py
      - name: integrity-remote unit tests on Linux
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -q -p no:cacheprovider -rs --import-mode=importlib components/integrity-remote/tests

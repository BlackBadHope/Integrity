name: Public surface safety

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    name: verify (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared Linux containment prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
      - name: Verify manifest closure and privacy boundary
        run: python .github/scripts/public_surface_check.py --root .
      - name: Verify component versions and canonical source layout
        run: |
          python -m pip install "build>=1.2,<2" "packaging>=24,<27" "pytest>=8.2,<10"
          python .github/scripts/component_catalog.py --root .
          python components/integrity-installed-runtime/verify_sources.py
          python -B components/integrity-seed/verify_public_surface.py
      - name: Public export hygiene
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -q -p no:cacheprovider tests/hygiene/test_public_export_hygiene.py
      - name: Build and install all public distributions
        run: |
          python .github/scripts/build_components.py --root . --output "$RUNNER_TEMP/integrity-dist"
          python .github/scripts/verify_wheels.py --root . --wheels "$RUNNER_TEMP/integrity-dist"
          python .github/scripts/install_components.py --wheels "$RUNNER_TEMP/integrity-dist" --venv "$RUNNER_TEMP/integrity-check" --github-path "$GITHUB_PATH"
      - name: Install the kill switch alone, check it and remove it
        # Its own empty environment: proves the switch needs no other Integrity package.
        run: python .github/scripts/killswitch_standalone_check.py --wheels "$RUNNER_TEMP/integrity-dist" --work "$RUNNER_TEMP/killswitch-alone"
      - name: Verify installed public profile
        run: |
          guardian version --all
          guardian capabilities
          guardian lts-contracts
          python -c "from integrity_adapter_sdk import require_guardian; print(require_guardian())"
      - name: Run the public functional suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -q -p no:cacheprovider --junitxml "$RUNNER_TEMP/root-junit.xml"
      - name: Create, check and remove a local memory instance
        # The installed command, in a runner-owned temporary folder.
        run: |
          guardian-local-memory init --home "$RUNNER_TEMP/local-memory-instance" --client claude-code
          guardian-local-memory doctor --home "$RUNNER_TEMP/local-memory-instance"
          guardian-local-memory uninstall --home "$RUNNER_TEMP/local-memory-instance" --yes
          test ! -e "$RUNNER_TEMP/local-memory-instance"
      - name: Create, check and remove a core instance (install stage 2)
        # The installed command; Linux only. Its sessions are driven by tests/test_core_instance.py.
        if: runner.os == 'Linux'
        run: |
          guardian-core-instance init --home "$RUNNER_TEMP/core-instance"
          guardian-core-instance doctor --home "$RUNNER_TEMP/core-instance"
          guardian-core-instance server-json --home "$RUNNER_TEMP/core-instance"
          guardian-core-instance uninstall --home "$RUNNER_TEMP/core-instance" --yes
          test ! -e "$RUNNER_TEMP/core-instance"
      - name: Core instance tests run, not skip
        if: runner.os == 'Linux'
        run: >-
          python .github/scripts/native_skip_guard.py "$RUNNER_TEMP/root-junit.xml"
          --require test_init_makes_a_private_instance_that_doctor_accepts
          --require test_a_second_session_reads_what_the_first_one_wrote
          --require test_two_sessions_open_at_once_both_write
      - name: Verify the local read-only MCP walkthrough
        # No vendor/model call; generated state stays in runner-owned temporary paths.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B examples/local-memory/create_case.py --output "$RUNNER_TEMP/local-memory-case"
          python -B examples/local-memory/setup.py --catalog "$RUNNER_TEMP/local-memory-case/private/catalog.sqlite" --output "$RUNNER_TEMP/local-memory-clients"
          python -B examples/local-memory/verify_connection.py "$RUNNER_TEMP/local-memory-clients/codex.config.toml" "$RUNNER_TEMP/local-memory-clients/claude.mcp.json" "$RUNNER_TEMP/local-memory-clients/antigravity.mcp.json"
      - name: Run component boundary and interoperability tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -q -p no:cacheprovider --import-mode=importlib --junitxml "$RUNNER_TEMP/components-junit.xml" components/*/tests
      - name: Linux Native client profiles run, not skip
        if: runner.os == 'Linux'
        run: >-
          python .github/scripts/native_skip_guard.py "$RUNNER_TEMP/components-junit.xml" "$RUNNER_TEMP/root-junit.xml"
          --require test_linux_user_native --require test_startup_gate
          --require test_nonretained_predecessor --require test_linux_native_lifecycle
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/*-junit.xml
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the shipped UI models
        working-directory: components/integrity-space
        run: npm test

  bus-hub:
    # Install stage 3, bus part: the hub with real accounts on one Linux machine, without
    # systemd and without the SSH gateway. sudo is used inside this runner only.
    name: bus hub (ubuntu, real accounts)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bus wheel alone
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build --wheel --outdir "$RUNNER_TEMP/bus-dist" components/integrity-llm-bus
      - name: Install the hub, use it over its socket from three accounts, remove it
        run: python .github/scripts/bus_hub_accounts_check.py --wheel "$(ls "$RUNNER_TEMP"/bus-dist/integrity_llm_bus-*.whl)"

  humanx-server:
    # Install stage 3, HumanX part: the web and the read-only gateway with real accounts next to
    # the bus hub on one Linux machine, without systemd. sudo is used inside this runner only.
    name: humanx server (ubuntu, real accounts)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bus and HumanX wheels
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" components/integrity-llm-bus
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" components/integrity-humanx
      - name: Install HumanX next to the bus hub, use the gateway and the web, remove both
        run: >-
          python .github/scripts/humanx_server_check.py
          --bus-wheel "$(ls "$RUNNER_TEMP"/dist/integrity_llm_bus-*.whl)"
          --humanx-wheel "$(ls "$RUNNER_TEMP"/dist/integrity_humanx-*.whl)"

  macos:
    # Core and client-memory on macOS. The README marks macOS as CI-tested only for
    # what this job runs; POSIX custody that needs bubblewrap is Linux-only.
    name: macos (core + client-memory, informational)
    runs-on: macos-latest
    # Not a merge gate yet: procfs-dependent custody (Toolzs authority ledger, Seed runtime
    # recovery) is Linux-only, so these suites have known macOS failures. The test steps may
    # fail without failing the job; the job summary reports the counts, and README
    # "Platform support" states that macOS is not supported yet.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install all public distributions
        run: |
          python -m pip install "build>=1.2,<2" "packaging>=24,<27" "pytest>=8.2,<10"
          python .github/scripts/build_components.py --root . --output "$RUNNER_TEMP/integrity-dist"
          python .github/scripts/install_components.py --wheels "$RUNNER_TEMP/integrity-dist" --venv "$RUNNER_TEMP/integrity-check" --github-path "$GITHUB_PATH"
      - name: Verify installed public profile
        run: |
          guardian version --all
          guardian capabilities
      - name: Run the core suite
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -q -p no:cacheprovider -rs --junitxml "$RUNNER_TEMP/root-junit.xml"
      - name: Run the client-memory suite
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -q -p no:cacheprovider -rs --import-mode=importlib --junitxml "$RUNNER_TEMP/components-junit.xml" components/integrity-client-memory/tests
      - name: Report macOS results (informational)
        if: always()
        run: |
          python - "$RUNNER_TEMP" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          print("### macOS (informational, not a merge gate)")
          print("| Suite | Passed | Failed | Skipped |")
          print("| --- | ---: | ---: | ---: |")
          for name in ("root", "components"):
              path = pathlib.Path(sys.argv[1]) / (name + "-junit.xml")
              if not path.exists():
                  print(f"| {name} | - | - | - |"); continue
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              total = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
              failed = total["failures"] + total["errors"]
              print(f"| {name} | {total['tests'] - failed - total['skipped']} | {failed} | {total['skipped']} |")
          PY
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-macos
          path: ${{ runner.temp }}/*-junit.xml
          if-no-files-found: ignore

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "integrity-guards"
version = "0.1.0a1"
description = "Hook-side guards for coding agents: a lock guard for host-changing shell commands, a configurable rule guard, and Uroboros compiled-route tooling with a repeat hook"
requires-python = ">=3.11"
license = "BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = []

[project.scripts]
integrity-guards = "integrity_guards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

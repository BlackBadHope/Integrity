[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "integrity-humanx"
version = "0.1.0a1"
description = "Explicitly configured HumanX operator room sources for Integrity"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
authors = [{ name = "Integrity Project contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2,<10"]

[project.scripts]
integrity-humanx = "integrity_humanx.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/integrity_humanx"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "configuration.example.json", "CONFIGURATION-VALUES.json", "SOURCE-MAP.json", "examples", "tests", "pyproject.toml"]

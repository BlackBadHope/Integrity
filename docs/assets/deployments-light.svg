<rect x="462" y="298" width="4" height="44" rx="2" fill="#0B7A5E"/>
<text x="480" y="315" font-size="15" font-weight="600" text-anchor="start" fill="#1F2328">Core on machine A</text>
<text x="480" y="335" font-size="13" font-weight="400" text-anchor="start" fill="#59636E">Guardian, Seed, Mind</text>
<rect x="852" y="24" width="404" height="356" rx="12" fill="#FBFCFD" stroke="#D0D7DE" stroke-dasharray="2 5"/>
<text x="876" y="60" font-size="18" font-weight="700" text-anchor="start" fill="#1F2328">Cloud agents</text>

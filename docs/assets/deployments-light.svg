<rect x="876" y="298" width="4" height="44" rx="2" fill="#0B7A5E"/>
<text x="894" y="315" font-size="15" font-weight="600" text-anchor="start" fill="#1F2328">Owner&#x27;s machine</text>
<text x="894" y="335" font-size="13" font-weight="400" text-anchor="start" fill="#59636E">verifies offline, imports as reported evidence</text>

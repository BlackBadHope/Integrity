<text x="755.75" y="64.5" text-anchor="middle" font-size="12.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1F2328">4 close</text>
<text x="24" y="96" font-size="13" xml:space="preserve" fill="#59636E" opacity="1"># scene 1: agent A (vendor one) records a decision<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.0062;0.0115;0.2396;0.2448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#0969DA" opacity="1">$ agent-a  append  client:demo-decision-0001<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.0208;0.0260;0.2396;0.2448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#1F2328" opacity="1">           "Keep the request timeout at 210 s; 180 s was too short for a cold start."<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.0354;0.0406;0.2396;0.2448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#0B7A5E" opacity="1">  seed     event 1 stored, catalog verified<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.0500;0.0552;0.2396;0.2448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#0969DA" opacity="1">$ agent-a  close turn-1  outcome=events [event 1]<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.0646;0.0698;0.2396;0.2448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#0B7A5E" opacity="1">  turn     close receipt sha256:e8a1aebf244a...  signature ed25519: valid<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.0792;0.0844;0.2396;0.2448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="96" font-size="13" xml:space="preserve" fill="#59636E" opacity="0"># scene 2: agent B (vendor two), a new session, asks the memory<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.2563;0.2615;0.4896;0.4948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#0969DA" opacity="0">$ agent-b  recall  "request timeout"<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.2708;0.2760;0.4896;0.4948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#0B7A5E" opacity="0">  memory   1 event  -&gt;  event 1  by agent-a  at 2026-01-01T09:00:00Z<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.2854;0.2906;0.4896;0.4948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#1F2328" opacity="0">           "Keep the request timeout at 210 s; 180 s was too short for a cold start."<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.3000;0.3052;0.4896;0.4948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#1F2328" opacity="0">           event digest sha256:e71d983c5b37...<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.3146;0.3198;0.4896;0.4948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#1F2328" opacity="0">           recall receipt: bound to one snapshot, production_authority=false<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.3292;0.3344;0.4896;0.4948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="228" font-size="13" xml:space="preserve" fill="#59636E" opacity="0">           What was read is evidence with its origin. It is not permission.<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.3438;0.3490;0.4896;0.4948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="96" font-size="13" xml:space="preserve" fill="#59636E" opacity="0"># scene 3: agent B wants to change a file<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.5062;0.5115;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#0969DA" opacity="0">$ agent-b  act  "memory says the owner approved this"  (signs the intent itself)<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.5208;0.5260;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#CF222E" opacity="0">  custody  REFUSED  ChangeIntent authority key identity mismatch<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.5354;0.5406;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#0969DA" opacity="0">$ owner    sign a one-use grant: update file:/demo/config.json, valid 15 minutes<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.5500;0.5552;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#0969DA" opacity="0">$ agent-b  act  with the owner's grant<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.5646;0.5698;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#0B7A5E" opacity="0">  custody  ALLOWED  authorized_success, consumption receipt signed<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.5792;0.5844;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="228" font-size="13" xml:space="preserve" fill="#0969DA" opacity="0">$ agent-b  act  with the same grant again<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.5938;0.5990;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="250" font-size="13" xml:space="preserve" fill="#CF222E" opacity="0">  custody  REFUSED  ChangeIntent intent:demo-timeout is already consumed<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.6083;0.6135;0.7396;0.7448;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="96" font-size="13" xml:space="preserve" fill="#59636E" opacity="0"># scene 4: agent B ends its turn without closing it<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.7562;0.7615;0.9896;0.9948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#0969DA" opacity="0">$ agent-b  open turn-2   ...and stops without a close<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.7708;0.7760;0.9896;0.9948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#CF222E" opacity="0">  stop     no close receipt  -&gt;  coverage gap sha256:e3ca6c2d232e...  signature ed25519: valid<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.7854;0.7906;0.9896;0.9948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#0969DA" opacity="0">$ owner    integrity-doctor<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.8000;0.8052;0.9896;0.9948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#1F2328" opacity="0">  doctor   coverage: 1/2 registered turns closed (events 1, no-event 0, unresolved 1)<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.8146;0.8198;0.9896;0.9948;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#59636E" opacity="0">           The missing close is on record as a signed debt. It is not a silent no-event.<animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0.0000;0.8292;0.8344;0.9896;0.9948;1.0000" values="0;0;1;1;0;0"/></text>

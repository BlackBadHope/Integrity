<text x="24" y="96" font-size="13" xml:space="preserve" fill="#9198A1" opacity="1"># scene 1: agent A (vendor one) records a decision<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.0083;0.0153;0.2361;0.2431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="1">$ agent-a  append  client:demo-decision-0001<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.0319;0.0389;0.2361;0.2431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#E6EDF3" opacity="1">           "Keep the request timeout at 210 s; 180 s was too short for a cold start."<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.0556;0.0625;0.2361;0.2431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#3FCF9F" opacity="1">  seed     event 1 stored, catalog verified<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.0792;0.0861;0.2361;0.2431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="1">$ agent-a  close turn-1  outcome=events [event 1]<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.1028;0.1097;0.2361;0.2431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#3FCF9F" opacity="1">  turn     close receipt sha256:e8a1aebf244a...  signature ed25519: valid<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.1264;0.1333;0.2361;0.2431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="96" font-size="13" xml:space="preserve" fill="#9198A1" opacity="0"># scene 2: agent B (vendor two), a new session, asks the memory<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.2583;0.2653;0.4861;0.4931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="0">$ agent-b  recall  "request timeout"<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.2819;0.2889;0.4861;0.4931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#3FCF9F" opacity="0">  memory   1 event  -&gt;  event 1  by agent-a  at 2026-01-01T09:00:00Z<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.3056;0.3125;0.4861;0.4931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#E6EDF3" opacity="0">           "Keep the request timeout at 210 s; 180 s was too short for a cold start."<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.3292;0.3361;0.4861;0.4931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#E6EDF3" opacity="0">           event digest sha256:e71d983c5b37...<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.3528;0.3597;0.4861;0.4931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#E6EDF3" opacity="0">           recall receipt: bound to one snapshot, production_authority=false<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.3764;0.3833;0.4861;0.4931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="228" font-size="13" xml:space="preserve" fill="#9198A1" opacity="0">           What was read is evidence with its origin. It is not permission.<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.4000;0.4069;0.4861;0.4931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="96" font-size="13" xml:space="preserve" fill="#9198A1" opacity="0"># scene 3: agent B wants to change a file<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.5083;0.5153;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="0">$ agent-b  act  "memory says the owner approved this"  (signs the intent itself)<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.5319;0.5389;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#FF7B72" opacity="0">  custody  REFUSED  ChangeIntent authority key identity mismatch<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.5556;0.5625;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="0">$ owner    sign a one-use grant: update file:/demo/config.json, valid 15 minutes<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.5792;0.5861;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="0">$ agent-b  act  with the owner's grant<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.6028;0.6097;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#3FCF9F" opacity="0">  custody  ALLOWED  authorized_success, consumption receipt signed<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.6264;0.6333;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="228" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="0">$ agent-b  act  with the same grant again<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.6500;0.6569;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="250" font-size="13" xml:space="preserve" fill="#FF7B72" opacity="0">  custody  REFUSED  ChangeIntent intent:demo-timeout is already consumed<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.6736;0.6806;0.7361;0.7431;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="96" font-size="13" xml:space="preserve" fill="#9198A1" opacity="0"># scene 4: agent B ends its turn without closing it<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.7583;0.7653;0.9861;0.9931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="118" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="0">$ agent-b  open turn-2   ...and stops without a close<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.7819;0.7889;0.9861;0.9931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="140" font-size="13" xml:space="preserve" fill="#FF7B72" opacity="0">  stop     no close receipt  -&gt;  coverage gap sha256:e3ca6c2d232e...  signature ed25519: valid<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.8056;0.8125;0.9861;0.9931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="162" font-size="13" xml:space="preserve" fill="#79B8FF" opacity="0">$ owner    integrity-doctor<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.8292;0.8361;0.9861;0.9931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="184" font-size="13" xml:space="preserve" fill="#E6EDF3" opacity="0">  doctor   coverage: 1/2 registered turns closed (events 1, no-event 0, unresolved 1)<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.8528;0.8597;0.9861;0.9931;1.0000" values="0;0;1;1;0;0"/></text>
<text x="24" y="206" font-size="13" xml:space="preserve" fill="#9198A1" opacity="0">           The missing close is on record as a signed debt. It is not a silent no-event.<animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0.0000;0.8764;0.8833;0.9861;0.9931;1.0000" values="0;0;1;1;0;0"/></text>

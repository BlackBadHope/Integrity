<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">Integrity demo: four scenes</title>
<desc id="d">Scene 1: agent A (vendor one) records a decision. Scene 2: agent B (vendor two), a new session, asks the memory. Scene 3: agent B wants to change a file. Scene 4: agent B ends its turn without closing it. Recorded from demo/run.py.</desc>

<title id="t">Integrity demo: three agents, one task, one memory</title>
<desc id="d">Scene 1: agent A claims the task and writes (Claude Code 2.1.318, claude-sonnet-5-5). Scene 2: agent B claims the task and writes (Codex CLI 0.163.0). Scene 3: agent C continues; it reads the memory and does not ask agent B. Scene 4: a second run: agent B stopped before the release and the close. Drawn from the records in demo/recorded.</desc>

<text x="543.0" y="94" font-size="12" font-weight="600" text-anchor="middle" fill="#3FCF9F">CI-tested, daily use</text>
<rect x="462" y="124" width="356" height="64" rx="10" fill="#161B22" stroke="#30363D"/>
<text x="480" y="151" font-size="15" font-weight="600" text-anchor="start" fill="#E6EDF3">Client machine B</text>
<text x="480" y="171" font-size="13" font-weight="400" text-anchor="start" fill="#9198A1">agents, hooks and broker</text>
<path d="M502 188L502 286" stroke="#6E7681" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

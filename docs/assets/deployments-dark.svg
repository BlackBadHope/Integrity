<text x="104" y="242" font-size="13" font-weight="400" text-anchor="start" fill="#9198A1">local MCP tools</text>
<rect x="48" y="288" width="356" height="64" rx="10" fill="#0E2A22" stroke="#3FCF9F"/>
<rect x="48" y="298" width="4" height="44" rx="2" fill="#3FCF9F"/>
<text x="66" y="315" font-size="15" font-weight="600" text-anchor="start" fill="#E6EDF3">Core on the same machine</text>
<text x="66" y="335" font-size="13" font-weight="400" text-anchor="start" fill="#9198A1">Guardian, Seed, Mind</text>

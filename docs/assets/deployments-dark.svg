<rect x="48" y="74" width="162" height="30" rx="15" fill="#0E2A22" stroke="#3FCF9F"/>
<text x="129.0" y="94" font-size="12" font-weight="600" text-anchor="middle" fill="#3FCF9F">CI-tested, daily use</text>

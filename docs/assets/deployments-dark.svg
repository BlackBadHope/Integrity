<text x="66" y="151" font-size="15" font-weight="600" text-anchor="start" fill="#E6EDF3">Agents, hooks and broker</text>
<text x="66" y="171" font-size="13" font-weight="400" text-anchor="start" fill="#9198A1">Claude Code, Codex, Antigravity</text>
